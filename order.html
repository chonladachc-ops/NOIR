<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สั่งซื้อสินค้า | Body Scent</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html">BODY SCENT</a>
      <nav class="nav" aria-label="เมนูหลัก">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้า</a>
      </nav>
    </div>
  </header>

  <main>

    <section class="page-head">
      <div class="container">
        <h1>สั่งซื้อสินค้า</h1>
        <hr class="rule">
        <p class="muted">กรอกข้อมูลด้านล่างเพื่อยืนยันคำสั่งซื้อ</p>
      </div>
    </section>

    <section class="section section--white">
      <div class="container">
        <form id="orderForm" class="form">

          <div class="field">
            <label for="customerName">ชื่อลูกค้า</label>
            <input type="text" id="customerName" name="customerName" autocomplete="name" required>
          </div>

          <div class="field">
            <label for="contact">เบอร์โทร / LINE</label>
            <input type="text" id="contact" name="contact" autocomplete="tel" required>
            <p class="hint">เบอร์โทรหรือ LINE ID ที่ติดต่อได้</p>
          </div>

          <div class="field">
            <label for="items">รายการสินค้า</label>
            <textarea id="items" name="items" rows="2" required></textarea>
          </div>

          <div class="field">
            <label for="total">จำนวนเงินรวม (บาท)</label>
            <input type="text" id="total" name="total" inputmode="decimal" required>
            <p class="hint">ตรวจสอบรายการและยอดรวมก่อนกดยืนยัน</p>
          </div>

          <div class="field">
            <label for="note">หมายเหตุ<span class="optional">(ไม่บังคับ)</span></label>
            <textarea id="note" name="note" rows="3"></textarea>
          </div>

          <button type="submit" class="btn btn--solid btn--block">ยืนยันสั่งซื้อ</button>

        </form>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <span>© 2026 Body Scent</span>
      <nav class="footer-links" aria-label="เมนูท้ายหน้า">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้า</a>
      </nav>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
